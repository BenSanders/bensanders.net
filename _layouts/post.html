{% include head.html %}
{% include header.html %}
<section id="post" class="h-entry">
    <div class="wrap article-grid">
        <h2 class="p-name">{{ page.title }}</h2>
        <small class="meta">{{ page.author }} | {{ page.date | date_to_long_string }} | {{ page.catagories }}</small>
        <div class="e-content">
            {{ content }}
        </div>
    </div>
</section>
<section>
    <div data-webmention-target="https://bensanders.net/"></div>
    <link rel="stylesheet" href="https://webmention.io/assets/webmention-render.css">
    <script src="https://webmention.io/js/webmention-render.js" defer></script>
</section>
{% include footer.html %}
